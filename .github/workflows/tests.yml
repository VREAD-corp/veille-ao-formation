name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]  # main runs the tests in update.yml before every build

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build the site with the stored data
        run: python -m veille build --out _site
