name: Mise à jour et publication

on:
  schedule:
    # 05:40 and 17:40 UTC: after BOAMP's two daily publications
    - cron: "40 5,17 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Re-fetch notices published since YYYY-MM-DD (optional backfill)"
        required: false
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Fetch BOAMP + TED
        env:
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then python -m veille update --since "$SINCE"; else python -m veille update; fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "data: mise à jour $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site
        run: python -m veille build --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
